# Fly.io config. Deploy with:
#   fly launch --no-deploy   (accept this file, pick an app name + region)
#   fly volumes create pluto_data --size 1
#   fly deploy
app = "plutonetwork"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "pluto_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
