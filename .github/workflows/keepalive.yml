# keeps a free-tier deployment awake by pinging it every 10 minutes.
# set the APP_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to your deployment, e.g. https://yourapp.koyeb.app
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "APP_URL repository variable not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${{ vars.APP_URL }}/health" && echo " awake"
